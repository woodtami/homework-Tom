<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5d8a">
<meta name="robots" content="noindex">
<title>שיעורי בית – תום</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שיעורי בית">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7f0;--accent:#4f6bed;--accent-soft:#eaeefd;--late:#e5484d;--late-soft:#fdecec;--today:#f59e0b;--today-soft:#fff5e1;--ok:#22a06b;--ok-soft:#e3f6ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--accent);color:#fff;padding:14px 18px 18px;padding-top:max(14px,env(safe-area-inset-top));border-radius:0 0 22px 22px}
.top{display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:1.35rem;font-weight:700}
header .sub{opacity:.9;font-size:.85rem;margin-top:2px}
.gear{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:1.3rem;width:44px;height:44px;border-radius:50%;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;font:inherit;color:var(--muted);padding:14px 0;border-radius:14px;cursor:pointer;font-size:.95rem}
nav button .ic{font-size:1.5rem;line-height:1}
nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
main{max-width:640px;margin:0 auto;padding:16px 14px 20px}
.status{color:var(--muted);padding:12px 4px}
.banner{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.05rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.banner .big{font-size:2rem;line-height:1}
.group{margin-bottom:34px}
.group+.group{padding-top:22px;border-top:2px dashed #d5dbe8}
.group h2{font-size:1.15rem;margin:0 2px 12px;font-weight:700;display:inline-block;background:var(--accent-soft);color:var(--accent);padding:6px 14px;border-radius:12px}
.late h2{color:var(--late);background:var(--late-soft)}.today h2{color:#b26b00;background:var(--today-soft)}
.task{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);border:2px solid transparent}
.late .task{border-color:var(--late-soft);background:#fffafa}
.task.done{opacity:.55}
.task.done .txt{text-decoration:line-through}
.chk{width:44px;height:44px;flex:none;border:3px solid #c7cede;border-radius:14px;background:#fff;cursor:pointer;display:grid;place-items:center;font-size:1.5rem;color:#fff;padding:0;transition:transform .15s}
.chk:active{transform:scale(.9)}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.emo{font-size:1.6rem;width:36px;text-align:center;flex:none}
.body{flex:1;min-width:0}
.subj{font-weight:700;font-size:1.1rem;color:var(--ink)}
.txt{font-size:1.05rem;font-weight:400;margin-top:2px;color:#3b4252;word-break:break-word}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;margin-top:6px;margin-left:4px}
.tag.late{background:var(--late-soft);color:var(--late)}
.tag.today{background:var(--today-soft);color:#b26b00}
.tag.soon{background:var(--accent-soft);color:var(--accent)}
.tag.bring{background:#f3e8fb;color:#8a3fb5}
.tag.cls{background:#e0f5f2;color:#0f766e}
.who-done{font-size:.8rem;color:var(--muted);margin-top:4px}
.tools{display:flex;flex-direction:column;gap:2px}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);font:inherit;font-size:.8rem;padding:6px;border-radius:8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 6px;font-size:1.1rem}
.hint{font-size:.9rem;color:var(--muted);margin:0 0 12px}
.drop{border:3px dashed #c7cede;border-radius:16px;padding:26px;text-align:center;cursor:pointer;color:var(--accent);font-weight:700;font-size:1.05rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.thumb img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.thumb input{font-size:.9rem;padding:6px}
.thumb .icon{align-self:center}
.drops{display:grid;gap:10px}
.drop small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:4px}
.thumbtype{font-size:.8rem;color:var(--muted);text-align:center}
.autodate{font-size:.85rem;text-align:center;color:var(--ok);font-weight:700;padding:6px 0}
.lightbox{position:fixed;inset:0;background:rgba(15,18,28,.96);z-index:20;display:flex;flex-direction:column}
.lb-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.lb-bar input{width:auto}
.lb-img{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
.lb-img img{max-width:100%;height:auto;cursor:zoom-in}
.lb-img img.zoom{max-width:none;width:220%;cursor:zoom-out}
.lb-hint{color:#aab;text-align:center;font-size:.8rem;margin:6px 0 calc(10px + env(safe-area-inset-bottom))}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;font:inherit;font-weight:700;padding:13px 20px;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
label.f{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px;flex:1;min-width:130px}
input,select,textarea{font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:60px;resize:vertical}
.rev{border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
.rev textarea{grid-column:1/-1}
.rev.dupe{background:#f1f3f7;opacity:.8;display:block}
.rev.dupe .x{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rev .x{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.err{color:var(--late);font-size:.9rem;margin-top:8px}
.bagday{font-size:1.25rem;font-weight:700;margin:0 6px 12px}
.bagsub{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bagname{font-weight:700;font-size:1.1rem;margin-bottom:4px}
.bagitems{font-size:1.05rem}
.bagextra{margin-top:8px;font-weight:700;color:#6b2a92;background:#f7eefc;padding:6px 10px;border-radius:10px}
.bagwarn{margin-top:8px;font-weight:700;color:var(--late);background:var(--late-soft);padding:6px 10px;border-radius:10px}
.bagitem{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05);font-size:1.05rem}
.bagitem .emo{font-size:1.4rem}
.bagitem small{display:block;color:var(--muted);font-size:.85rem}
.bagitem.extra{background:#f7eefc;font-weight:700;color:#6b2a92}
.bagitem.warn{background:var(--late-soft)}
.empty{text-align:center;padding:40px 10px;font-size:1.1rem;color:var(--muted)}
.empty .big{font-size:3.5rem;display:block;margin-bottom:8px}
.empty b{display:block;font-size:1.4rem;color:var(--ok);margin-bottom:4px}
.tt{width:100%;border-collapse:collapse;font-size:.8rem}
.tt td,.tt th{border:1px solid var(--line);padding:5px;text-align:right;vertical-align:top}
.tt th{background:var(--accent-soft)}
.who{display:flex;gap:10px}
.who button{flex:1;font-size:1.2rem;padding:18px 6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 18px;border-radius:14px;font-size:.95rem;z-index:9}
</style>
</head>
<body>
<header>
  <div class="top"><div><h1>השיעורים של תום</h1><div class="sub" id="todayLbl"></div></div><button class="gear" onclick="go('settings')" aria-label="הגדרות">⚙︎</button></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="status">טוען…</div></main>

<script>
/* ===== מערכת שעות (0=ראשון) ===== */
const TT = {
  0:["מדעים","כישורי חיים","שפה","תורה","חווה חקלאית"],
  1:["שפה","מתמטיקה","שפה","בישול"],
  2:["חנ\"ג","מדעים","מתמטיקה","שפה","אנגלית פרטי"],
  3:["אנגלית","מולדת","שפה","תורה","מדעים","שבילי מורשת"],
  4:["חנ\"ג","מתמטיקה","שפה","מפתח הלב"],
  5:["אנגלית","מוזיקה"]
};
const SUBJECTS = ["מתמטיקה","שפה","מדעים","תורה","אנגלית","אנגלית פרטי","מולדת","שבילי מורשת","כישורי חיים","מפתח הלב","חווה חקלאית","בישול","חנ\"ג","מוזיקה","אחר"];
const BAG = {
  "מתמטיקה":["מחברת מתמטיקה","מחברת גאומטריה","חוברת השבחה 1"],
  "שפה":["מחברת שפה","חוברת עולמות","ספר קריאה","קלסר מנילה"],
  "מדעים":["מחברת מדעים","ספר מדעים"],
  "תורה":["מחברת תורה","חומש בראשית"],
  "אנגלית":["Jet 1 Book","Alphabet Workbook","מחברת אנגלית"],
  "מולדת":["מחברת מולדת","ספר מולדת"],
  "שבילי מורשת":["מחברת מורשת"],
  "כישורי חיים":["מחברת שורות"],
  "מפתח הלב":["מחברת שורות"],
  "חווה חקלאית":["נעליים סגורות","תיק קטן עם בקבוק מים"],
  "בישול":[],
  "חנ\"ג":["בגדי ספורט ובקבוק מים"],
  "מוזיקה":[]
};
const NOT_BAG = ["אנגלית פרטי"];
const DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const DSHORT = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const WHO = ["אמא","אבא","תום"];
const PREFERRED_MODELS = ["gemini-3.8-flash","gemini-3.6-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-3-flash-preview","gemini-flash-latest"];

/* ===== תאריכים ===== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>parse(s).getDay();
const today=()=>iso(new Date());
const fmt=s=>s?`יום ${DSHORT[dow(s)]} ${parse(s).getDate()}/${parse(s).getMonth()+1}`:"";
function nextSchoolDay(s){let d=addDays(s,1);while(dow(d)===6)d=addDays(d,1);return d}
function nextLesson(subject,from){for(let i=1;i<=21;i++){const d=addDays(from,i);if((TT[dow(d)]||[]).includes(subject))return d}return null}
function computeDates(subject,from,explicit){const lesson=explicit||nextLesson(subject,from)||addDays(from,1);return{lessonDate:lesson,dueDate:addDays(lesson,-1)}}
function normSubject(s){
  s=(s||"").trim();
  if(/פרטי/.test(s))return "אנגלית פרטי";
  if(/גאומטר|חשבון|מתמט/.test(s))return "מתמטיקה";
  if(/אנגל|english/i.test(s))return "אנגלית";
  if(/חנ.?.?ג|ספורט|חינוך גופני/.test(s))return "חנ\"ג";
  if(/חווה/.test(s))return "חווה חקלאית";
  if(/מפתח הלב|פל.?.?א/.test(s))return "מפתח הלב";
  if(/מורשת/.test(s))return "שבילי מורשת";
  if(/לשון|שפה|קריאה|עברית/.test(s))return "שפה";
  return SUBJECTS.find(x=>s.includes(x)||x.includes(s))||"אחר";
}

/* ===== הגדרות מקומיות ===== */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
(function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("u")&&h.get("k")){store.set("sbUrl",h.get("u"));store.set("sbKey",h.get("k"))}
})();
const cfg={url:store.get("sbUrl"),key:store.get("sbKey")};
let who=store.get("who");
let gkey=store.get("gkey");
const isParent=()=>who&&who!=="תום";
const canUpload=()=>isParent()&&!!gkey;
function familyLink(){return location.origin+location.pathname+"#u="+encodeURIComponent(cfg.url)+"&k="+encodeURIComponent(cfg.key)}

/* ===== Supabase REST ===== */
async function sb(path,opt={}){
  const r=await fetch(cfg.url.replace(/\/$/,"")+"/rest/v1/"+path,{...opt,headers:{apikey:cfg.key,...(cfg.key.startsWith("sb_")?{}:{Authorization:"Bearer "+cfg.key}),"Content-Type":"application/json",Prefer:"return=representation",...(opt.headers||{})}});
  if(!r.ok)throw new Error((await r.text())||r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
let hasGiven=true;
const fromRow=r=>({id:r.id,subject:r.subject,text:r.text,kind:r.kind,dueDate:r.due_date,lessonDate:r.lesson_date,done:r.done,doneBy:r.done_by,doneAt:r.done_at,createdAt:r.created_at,givenDate:r.given_date||null});
const toRow=t=>({id:t.id,subject:t.subject,text:t.text,kind:t.kind,due_date:t.dueDate,lesson_date:t.lessonDate,done:!!t.done,done_by:t.doneBy||null,done_at:t.doneAt||null,...(hasGiven?{given_date:t.givenDate||t.sourceDate||null}:{})});

/* ===== מצב ===== */
let tasks=[],loaded=false,loadErr="",view="open";
let pendingImgs=[],pendingText="",reviewing=null,busy=false,aiErr="",editId=null,confirmId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
$("#todayLbl").textContent=`היום: יום ${DAYS[new Date().getDay()]} ${new Date().getDate()}/${new Date().getMonth()+1}${who?" · "+who:""}`;

async function load(){
  if(!cfg.url||!cfg.key){loadErr="nolink";render();return}
  try{const rows=await sb("tasks?select=*&order=due_date.asc");if(rows.length)hasGiven="given_date" in rows[0];tasks=rows.map(fromRow);loaded=true;loadErr=""}
  catch(e){loadErr="לא הצלחתי לטעון את הרשימה. בדקו חיבור לאינטרנט.";console.error(e)}
  if(!editId&&!editBring&&!reviewing&&!["TEXTAREA","INPUT","SELECT"].includes(document.activeElement?.tagName))render();
}
setInterval(load,20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});

/* ===== פעולות ===== */
async function toggle(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const done=!t.done;Object.assign(t,{done,doneBy:done?who:null,doneAt:done?new Date().toISOString():null});render();
  try{await sb("tasks?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({done,done_by:t.doneBy,done_at:t.doneAt})})}
  catch(e){t.done=!done;render();toast("לא נשמר – בדקו אינטרנט")}
}
async function removeTask(id){
  if(confirmId!==id){confirmId=id;render();setTimeout(()=>{if(confirmId===id){confirmId=null;render()}},4000);return}
  confirmId=null;tasks=tasks.filter(t=>t.id!==id);render();
  try{await sb("tasks?id=eq."+encodeURIComponent(id),{method:"DELETE"})}catch(e){toast("המחיקה נכשלה");load()}
}
async function saveEdit(id){
  const box=document.getElementById("ed-"+id),t=tasks.find(x=>x.id===id);
  Object.assign(t,{subject:box.querySelector("[name=subject]").value,kind:box.querySelector("[name=kind]").value,text:box.querySelector("[name=text]").value.trim(),dueDate:box.querySelector("[name=due]").value,givenDate:box.querySelector("[name=given]").value||t.givenDate});
  if(t.givenDate)t.lessonDate=computeDates(t.subject,t.givenDate,null).lessonDate;
  editId=null;render();
  try{await sb("tasks?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({subject:t.subject,kind:t.kind,text:t.text,due_date:t.dueDate,lesson_date:t.lessonDate,...(hasGiven&&t.givenDate?{given_date:t.givenDate}:{})})})}catch(e){toast("לא נשמר");load()}
}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function addTasks(list){
  const mk=()=>list.map(t=>toRow({...t,id:t.id||(t.id=newId()),done:false}));
  let res;
  try{res=await sb("tasks",{method:"POST",body:JSON.stringify(mk())})}
  catch(e){if(hasGiven&&/given_date/.test(String(e.message))){hasGiven=false;res=await sb("tasks",{method:"POST",body:JSON.stringify(mk())})}else throw e}
  tasks.push(...res.map(fromRow));
}

/* ===== תצוגה ===== */
function relDay(d){
  const td=today();
  if(d<td)return "עבר הזמן!";
  if(d===td)return "עד היום";
  if(d===addDays(td,1))return "עד מחר";
  return "עד יום "+DAYS[dow(d)];
}
function dueCls(d){const td=today();return d<td?"late":d===td?"today":"soon"}
function taskHtml(t){
  if(editId===t.id)return `<div class="task" id="ed-${t.id}"><div class="body" style="display:grid;gap:8px">
    <select name="subject">${SUBJECTS.map(s=>`<option ${s===t.subject?"selected":""}>${s}</option>`).join("")}</select>
    <select name="kind">${[["homework","ש.ב"],["classwork","בכיתה"],["bring","להביא"]].map(([v,l])=>`<option value="${v}" ${v===t.kind?"selected":""}>${l}</option>`).join("")}</select>
    <textarea name="text">${esc(t.text)}</textarea>
    <label class="f">ניתן ביום${t.givenDate?"":" <span style='color:var(--muted)'>(לא נשמר במשימה הזו)</span>"}<input type="date" name="given" value="${t.givenDate||""}" max="${today()}" onchange="const f=this.closest('.body');if(this.value){const d=computeDates(f.querySelector('[name=subject]').value,this.value,null);f.querySelector('[name=due]').value=d.dueDate}"></label>
    <label class="f">לסיים עד<input type="date" name="due" value="${t.dueDate||""}"></label>
    <div class="row" style="margin:0"><button class="btn" onclick="saveEdit('${t.id}')">שמירה</button><button class="btn ghost" onclick="editId=null;render()">ביטול</button><button class="icon" style="margin-inline-start:auto;color:var(--late)" onclick="removeTask('${t.id}')">${confirmId===t.id?"בטוח?":"הסרה"}</button></div></div></div>`;
  const kindTag=t.kind==="bring"?`<span class="tag bring">להביא</span>`:t.kind==="classwork"?`<span class="tag cls">מהכיתה – לבדוק</span>`:"";
  return `<div class="task ${t.done?"done":""}">
    <button class="chk" aria-label="סימון" onclick="toggle('${t.id}')">${t.done?"✓":""}</button>
    <div class="body"><div class="subj">${esc(t.subject)}</div>
      <div class="txt">${esc(t.text)}</div>

- classwork: עבודה מוגדרת שנעשתה בכיתה וצריך לוודא שהושלמה (עמודים, דף עבודה, תרגילים), למשל "בכיתה – עמ' 19". אם אותה עבודה כתובה גם "לסיים בבית" – רק homework.
התעלם מכל השאר: נושאי שיעור, שאלות שהן כותרת של שיעור, הודעות כלליות, ציוד להביא (קבוע או מיוחד), "נא להביא…", "הביאו…", בחירות, טיולים, תזכורות. אם אין משימות – החזר items ריק.
subject: אחד מ: ${SUBJECTS.join(", ")} (גאומטריה = מתמטיקה; לשון = שפה).
text: קצר וברור בעברית, למשל "עמ' 41–42 – לסיים בבית".
lessonDate: תאריך השיעור שבו מגישים, רק אם נכתב במפורש כתאריך, אחרת null.
${pendingText.trim()?`טקסט ההודעה:\n"""\n${pendingText.trim()}\n"""\n`:""}
החזר JSON בלבד: {"items":[{"subject":"","text":"","kind":"homework|classwork","image":1,"dateInImage":null,"lessonDate":null}]}`;
}
async function pickModels(){
  const cached=store.get("gmodel");
  let list=[];
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(gkey)}`);
    if(r.ok){
      const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
        .filter(n=>/flash/.test(n)&&!/image|tts|live|audio|embed|thinking/.test(n));
    }else if(r.status===400||r.status===403){throw {status:r.status,body:await r.text()}}
  }catch(e){if(e&&e.status)throw e}
  const ordered=[...PREFERRED_MODELS.filter(m=>list.includes(m)),...list.filter(m=>!PREFERRED_MODELS.includes(m)).sort().reverse()];
  if(!ordered.length)ordered.push(...PREFERRED_MODELS);
  if(cached&&ordered.includes(cached)){ordered.splice(ordered.indexOf(cached),1);ordered.unshift(cached)}
  return ordered;
}
async function callGemini(parts){
  let lastErr;
  for(const model of (await pickModels()).slice(0,4)){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(gkey)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:"application/json",temperature:0.1}})});
    if(r.ok){
      const j=await r.json();const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      const m=txt.match(/\{[\s\S]*\}/);if(!m){lastErr={status:"empty",body:JSON.stringify(j).slice(0,200)};continue}
      store.set("gmodel",model);return JSON.parse(m[0]);
    }
    lastErr={status:r.status,body:await r.text(),model};
    if(r.status===400||r.status===403||r.status===429)break;
  }
  throw lastErr||{status:"none"};
}
function normDate(x){
  if(typeof x!=="string")return null;x=x.trim();let m;
  if(m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if(m=x.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
  if(m=x.match(/(\d{1,2})[./](\d{1,2})/)){let y=new Date().getFullYear();let d=`${y}-${pad(+m[2])}-${pad(+m[1])}`;if(d>today())d=`${y-1}-${pad(+m[2])}-${pad(+m[1])}`;return d}
  return null;
}
async function readInput(){
  const srcDate=$("#srcDate").value||today();
  busy=true;aiErr="";render();
  try{
    const parts=[{text:buildPrompt(srcDate)}];
    for(const [i,p] of pendingImgs.entries()){parts.push({text:`תמונה ${i+1} (${p.manual?"תמונה רגילה – צילום לוח או הודעה, ללא תאריך; dateInImage=null":"צילום מסך מאפליקציית בית הספר"}):`});parts.push({inline_data:{mime_type:"image/jpeg",data:await b64(p.blob)}})}
    const out=await callGemini(parts);
    reviewing=(out.items||[]).map(it=>{
      const subject=normSubject(it.subject),okD2=normDate,okD=x=>{const d=normDate(x);return d&&d<=today()?d:null},img=pendingImgs[(Number(it.image)||0)-1]||(pendingImgs.length===1&&!pendingText.trim()?pendingImgs[0]:null),inImg=okD(it.dateInImage),from=(img&&img.manual?img.date:null)||inImg||(img&&img.date)||srcDate,dateSrc=img&&img.manual?"manual":inImg?"image":img?"file":"text",lesson=okD2(it.lessonDate)&&okD2(it.lessonDate)>from?okD2(it.lessonDate):null,d=computeDates(subject,from,lesson),text=(it.text||"").trim();
      const n=s=>(s||"").replace(/[^֐-׿a-z0-9]/gi,"");
      const dup=findDup(subject,text,d.lessonDate)||null;
      return{subject,text,kind:it.kind==="classwork"?"classwork":"homework",...d,dup,sourceDate:from,dateSrc};
    });
  }catch(e){
    console.error(e);
    const detail=e&&e.body?String(e.body).replace(/\s+/g," ").slice(0,160):(e&&e.message)||"";
    aiErr=(e&&(e.status===400||e.status===403)?"המפתח של Gemini לא תקין או לא מאושר – בדקו בהגדרות.":e&&e.status===429?"הגעתם למגבלה של המסלול החינמי. נסו שוב בעוד כמה דקות.":"לא הצלחתי לקרוא. נסו שוב או הוסיפו ידנית.")+(detail?` (פרטים לשליחה ל-Claude: ${e.status||""} ${detail})`:"");
  }
  busy=false;render();
}
function revSet(i,k,v){reviewing[i][k]=v;if(k==="subject"||k==="sourceDate"){Object.assign(reviewing[i],computeDates(reviewing[i].subject,reviewing[i].sourceDate||today(),null));render()}}
function findDup(subject,text,lessonDate){
  const n=x=>(x||"").replace(/[^\u0590-\u05FFa-z0-9]/gi,"");
  const nums=x=>((x||"").match(/\d+/g)||[]).join(",");
  const near=(a,b)=>!a||!b||Math.abs(parse(a)-parse(b))<=8*864e5;
  return tasks.find(t=>t.subject===subject&&t.kind!=="bring"&&near(t.lessonDate,lessonDate)&&(
    n(t.text)===n(text)||(n(text).length>5&&(n(t.text).includes(n(text))||n(text).includes(n(t.text))))||(nums(text)&&nums(t.text)===nums(text))));
}
async function saveReview(){
  const list=reviewing.filter(r=>r.text.trim()&&(!r.dup||r.force));
  if(!list.length){toast("אין משימות חדשות לשמור");reviewing=null;render();return}
  try{await addTasks(list);reviewing=null;pendingImgs=[];pendingText="";toast(`נשמרו ${list.length} משימות חדשות`);go("open")}
  catch(e){toast("השמירה נכשלה – בדקו אינטרנט")}
}
let manualForce=null;
async function manualAdd(){
  const subject=$("#mSub").value,kind=$("#mKind").value,text=$("#mText").value.trim(),due=$("#mDue").value;
  if(!text){toast("כתבו מה צריך לעשות");return}
  const d=computeDates(subject,today(),null);
  const dup=findDup(subject,text,d.lessonDate);
  if(dup&&manualForce!==text){manualForce=text;$("#mWarn").innerHTML=`כבר ברשימה: ${esc(dup.subject)} – ${esc(dup.text)}${dup.done?" (סומן כבוצע)":""}. ללחוץ שוב על "הוספה" כדי להוסיף בכל זאת.`;return}
  manualForce=null;
  try{await addTasks([{subject,kind,text,dueDate:due||d.dueDate,lessonDate:d.lessonDate,givenDate:today()}]);$("#mText").value="";$("#mWarn").textContent="";toast("נוסף")}catch(e){toast("לא נשמר")}
}

    ["שפה","מי שלא סיים: חוברת עמ' 48–49","homework","2026-11-07","2026-11-08"],

    ["אנגלית פרטי","עמוד 32","homework","2026-11-09","2026-11-10"]
  ].map(([subject,text,kind,dueDate,lessonDate])=>({subject,text,kind,dueDate,lessonDate}));
  try{await addTasks(seed);toast("הועברו "+seed.length+" משימות");go("open")}catch(e){toast("ההעברה נכשלה")}
